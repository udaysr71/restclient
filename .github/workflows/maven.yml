# Builds and tests REST Client.
#
# The project has no dependencies, so there's no dependency graph to submit: GitHub's "Java with Maven" starter
# adds an "Update dependency graph" step (advanced-security/maven-dependency-submission-action) that crashes on a
# pom with no <dependencies> ("Cannot read properties of undefined (reading 'forEach')"). It's left out here.
#
# Supply chain: every action is pinned to a full commit SHA (the comment shows its tag), the workflow can only
# read the repository, and the build itself downloads nothing: `java Build.java` uses only the JDK. The Maven
# step is there to keep pom.xml working for IDEs; Maven downloads its own plugins from Maven Central.

name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the jar and run the unit tests
        run: java Build.java

      - name: Check the samples/ files match the code
        run: |
          java Build.java samples
          git diff --exit-code samples/

      - name: Check pom.xml still compiles (for IDEs)
        run: mvn -B -ntp -q compile

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: restclient-jar
          path: build/restclient.jar
          if-no-files-found: error

  ui:
    name: UI and end-to-end checks
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      # The interaction check, then the feature check against local HTTP/HTTPS servers, a restart, and a first launch
      - name: Run the UI checks
        run: xvfb-run -a -s "-screen 0 1440x900x24" java Build.java uicheck
